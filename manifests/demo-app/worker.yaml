apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  namespace: demo-app
data:
  001_create_events.sql: |
    CREATE TABLE IF NOT EXISTS events (
      id BIGSERIAL PRIMARY KEY,
      event_id TEXT NOT NULL UNIQUE,
      type TEXT NOT NULL,
      payload JSONB NOT NULL,
      ts BIGINT NOT NULL
    );
  002_add_processed_events.sql: |
    CREATE TABLE IF NOT EXISTS processed_events (
      id         BIGSERIAL PRIMARY KEY,
      event_id   TEXT      NOT NULL,
      type       TEXT      NOT NULL,
      payload    JSONB     NOT NULL,
      ts         BIGINT    NOT NULL,
      pod_name   TEXT      NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sqs-worker   # IRSA SA: sqs:ReceiveMessage + sqs:DeleteMessage
      initContainers:
      - name: migrate
        image: postgres:16
        command:
        - sh
        - -c
        - |
          psql -h postgres -U app -d app -f /migrations/001_create_events.sql
          psql -h postgres -U app -d app -f /migrations/002_add_processed_events.sql
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-app-secrets
              key: pg_password
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      containers:
      - name: worker
        image: YOUR_ECR/worker:dev
        env:
        - name: AWS_REGION
          value: eu-west-3
        - name: SQS_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: demo-app-secrets
              key: sqs_queue_url
        - name: PGHOST
          value: postgres
        - name: PGDATABASE
          value: app
        - name: PGUSER
          value: app
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-app-secrets
              key: pg_password
        - name: WORKER_MODE
          value: idempotent
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: metrics
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
      volumes:
      - name: migrations
        configMap:
          name: db-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: demo-app
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
  clusterIP: None  # headless — Prometheus scrapes each pod individually
