# ServiceAccounts with IRSA annotations.
# Replace ACCOUNT_ID with your AWS account ID before applying,
# or let the deploy script inject it:
#   ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
#   sed -i "s/ACCOUNT_ID/$ACCOUNT_ID/g" manifests/demo-app/serviceaccounts.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-api
  namespace: demo-app
  annotations:
    # Role created by infra/environments/dev/addon_irsa_sqs_api.tf
    # Permissions: sqs:SendMessage only
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/replicasafe-dev-sqs-api"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqs-worker
  namespace: demo-app
  annotations:
    # Role created by infra/environments/dev/addon_irsa_sqs_worker.tf
    # Permissions: sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/replicasafe-dev-sqs-worker"
